server:
  port: 8081 # порт, на котором сервис будет слушать запросы

# Настройка уровней логирования
logging:
  level:
    # Уровни логирования:
    # ERROR - Только ошибки
    # WARN - Предупреждения + ERROR
    # INFO - Обычные рабочие события + WARN + ERROR
    # DEBUG - Подробная информация для отладки (шаги, запросы, состояния)
    # TRACE - Максимально детально (каждый шаг выполнения)
    org.flywaydb: DEBUG # Для Flyway
    org.springframework.boot.autoconfigure.flyway: DEBUG # Для автоконфигурации

spring:
  application:
    name: auth-service # имя сервиса (видно в логах, используется в Eureka)

  # Настройки подключения к БД
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: admin
    password: admin

  # Настройки JPA (ORM)
  jpa:
    hibernate:
      # ddl-auto - стратегия управления схемой БД.
      # validate - проверяет, соответствует ли схема БД @Entity-классам.
      ddl-auto: validate
    show-sql: true # вывод сгенерированные SQL-запросы в консоль
    properties:
      hibernate:
        format_sql: true # форматировать SQL с переносами строк и отпусками (иначе все в одну строку)

  # Настройки FLYWAY (миграции)
  flyway:
    enabled: true # включить миханизм миграции
    # Создать таблицу flyway_schema_history, если ее еще нет и пометить текущее состояние как базовое. Необходимо, если БД уже существовала до Flyway
    baseline-on-migrate: true
    locations: classpath:db/migration # где искать SQL-файлы миграций

# Настройки Actuator (эндпоинты для мониторинга)
management:
  endpoints:
    web:
      exposure:
        include: health,info # какие actuator-эндпоинты открыть наружу

# Настройки JWT (механизма аутентификации)
# Токен подписывается алгоритмом RS256 приватным ключом сервиса (RS256 - асимметричная подпись:
# подписать может только auth-service, а проверить может кто угодно, имея публичный ключ).
# keys-dir - каталог с парой ключей private.pem / public.pem. Если его нет, пара генерируется
# при первом старте. Каталог не коммитится в git.
# expiration - время жизни токена. Короткий срок ограничивает окно, в котором удалённый
# пользователь ещё может ходить с уже выданным токеном.
# issuer - адрес auth-service, который кладётся в claim iss: сервис-проверяющий убеждается,
# что токен выпущен именно этим сервисом, а не кем-то другим с тем же ключом.
jwt:
  keys-dir: ${JWT_KEYS_DIR:keys} # где лежат private.pem и public.pem
  expiration: ${JWT_EXPIRATION:900000} # 900000 = 15 минут
  issuer: ${JWT_ISSUER:http://localhost:8081} # значение claim iss в выпущенных токенах